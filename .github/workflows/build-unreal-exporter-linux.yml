name: Build UnrealExporter Linux
on:
  push:
    paths:
      - '.github/workflows/build-unreal-exporter-linux.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UnrealExporter v2.0.0
        uses: actions/checkout@v4
        with:
          repository: luk-gg/UnrealExporter
          ref: v2.0.0
          submodules: false
          path: UnrealExporterSource
      - name: Checkout pinned CUE4Parse
        uses: actions/checkout@v4
        with:
          repository: FabianFG/CUE4Parse
          ref: 5c2a8ba99c0ea3e39d3743e12960a2fa0ce17e89
          path: UnrealExporterSource/CUE4Parse
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish Linux self-contained
        run: |
          dotnet publish UnrealExporterSource/UnrealExporter/UnrealExporter.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=false \
            -o publish-linux
          chmod +x publish-linux/UnrealExporter || true
          ls -lah publish-linux
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: UnrealExporter-2.0.0-linux-x64
          path: publish-linux
          compression-level: 0
          retention-days: 1
